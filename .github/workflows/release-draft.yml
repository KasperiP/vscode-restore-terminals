name: Draft release

# Pushing a version tag builds the extension and opens a draft release with the
# .vsix attached. Assets cannot be added to a release once it is published, so
# everything has to be in place before you publish the draft.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  draft:
    name: Package and draft
    runs-on: ubuntu-latest
    permissions:
      contents: write # to create the draft release and attach the .vsix
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Install pnpm
        uses: pnpm/action-setup@v6
      - name: Install Node
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Check the tag matches package.json
        run: |
          set -euo pipefail
          TAG="${{ github.ref_name }}"
          PACKAGE_VERSION="$(jq -r '.version' package.json)"
          if [ "${TAG#v}" != "$PACKAGE_VERSION" ]; then
            echo "::error::Tag $TAG does not match package.json version $PACKAGE_VERSION"
            exit 1
          fi
      - name: Verify
        run: pnpm test
      - name: Package extension
        id: package
        run: |
          set -euo pipefail
          VSIX="$(jq -r '.name' package.json)-$(jq -r '.version' package.json).vsix"
          # --no-dependencies: the extension bundles with esbuild and has no
          # runtime dependencies, and vsce cannot walk pnpm's symlinked
          # node_modules.
          pnpm exec vsce package --no-dependencies -o "$VSIX"
          echo "vsix=$VSIX" >> "$GITHUB_OUTPUT"
      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${{ github.ref_name }}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::error::Release $TAG already exists. Immutable releases cannot" \
              "be amended, so bump the version and tag again."
            exit 1
          fi
          gh release create "$TAG" \
            --draft \
            --title "$TAG" \
            --generate-notes \
            "${{ steps.package.outputs.vsix }}"
          echo "::notice::Draft release $TAG created. Review it, then publish to" \
            "ship to the Marketplace."
