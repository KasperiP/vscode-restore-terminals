name: Release

# Publishing is deliberate: draft a GitHub Release and publish it. Pushing to
# master no longer ships anything.
on:
  release:
    types: [published]

# Least privilege by default. Jobs opt into more where they need it.
permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    name: Package
    runs-on: ubuntu-latest
    permissions:
      contents: write # to attach the .vsix to the release
    outputs:
      vsix: ${{ steps.package.outputs.vsix }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Install pnpm
        uses: pnpm/action-setup@v6
      - name: Install Node
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Check the tag matches package.json
        run: |
          set -euo pipefail
          TAG="${{ github.event.release.tag_name }}"
          PACKAGE_VERSION="$(jq -r '.version' package.json)"
          if [ "${TAG#v}" != "$PACKAGE_VERSION" ]; then
            echo "::error::Release tag $TAG does not match package.json version $PACKAGE_VERSION"
            exit 1
          fi
      - name: Verify
        run: pnpm test
      - name: Package extension
        id: package
        run: |
          set -euo pipefail
          VSIX="$(jq -r '.name' package.json)-$(jq -r '.version' package.json).vsix"
          # --no-dependencies: the extension bundles with esbuild and has no
          # runtime dependencies, and vsce cannot walk pnpm's symlinked
          # node_modules.
          pnpm exec vsce package --no-dependencies -o "$VSIX"
          echo "vsix=$VSIX" >> "$GITHUB_OUTPUT"
      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: vsix
          path: ${{ steps.package.outputs.vsix }}
          if-no-files-found: error
      - name: Attach the .vsix to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ github.event.release.tag_name }}" \
            "${{ steps.package.outputs.vsix }}" --clobber

  publish:
    name: Publish to Marketplace
    needs: build
    runs-on: ubuntu-latest
    # Holds VSCE_PAT and can require a manual approval. Configure under
    # Settings > Environments > marketplace.
    environment: marketplace
    steps:
      # Deliberately no checkout. This job holds the publishing token and only
      # ever handles the artifact the build job produced, so repository code
      # never executes next to the secret.
      - name: Install Node
        uses: actions/setup-node@v7
        with:
          node-version: 26
      - name: Download the packaged extension
        uses: actions/download-artifact@v8
        with:
          name: vsix
      - name: Check publishing credentials
        run: |
          if [ -z "${VSCE_PAT}" ]; then
            echo "::error::VSCE_PAT is not set on the marketplace environment." \
              "Create the publisher at https://marketplace.visualstudio.com/manage/publishers," \
              "then add an Azure DevOps token (Organization: All accessible organizations," \
              "scope: Marketplace > Manage) under Settings > Environments > marketplace."
            exit 1
          fi
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
      - name: Publish extension
        # Publishes the exact file the build job produced and the release
        # carries, rather than rebuilding from source.
        run: |
          npx --yes @vscode/vsce@3.9.2 publish \
            -i "${{ needs.build.outputs.vsix }}" \
            ${{ github.event.release.prerelease && '--pre-release' || '' }}
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
